<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERKUZ — Holistic Mental Health and Wellness Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Noto+Serif+Ethiopic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --olive: #4A5D4B;
      --olive-light: #6B7F6C;
      --olive-pale: #8FA390;
      --forest: #2F3E30;
      --cream: #F9F6F1;
      --cream-warm: #F3EDE3;
      --linen: #EDE7DB;
      --clay: #C4A882;
      --clay-light: #D9C9AD;
      --clay-pale: #E8DCCB;
      --text: #2A2A28;
      --text-soft: #5E5C56;
      --text-faint: #8A877F;
      --white: #FFFFFF;
      --divider: rgba(74, 93, 75, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .ethiopic { font-family: 'Noto Serif Ethiopic', serif; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 20px 0;
      background: rgba(249, 246, 241, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: all 0.5s ease;
    }
    nav.scrolled {
      padding: 14px 0;
      box-shadow: 0 1px 0 var(--divider);
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 0 40px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 600;
      color: var(--forest);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }


    /* ── SERVICES ── */
